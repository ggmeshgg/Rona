name: Extract representative pages

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "1-based PDF page numbers, comma-separated"
        required: false
        default: "70,83"
      dpi:
        description: "Render DPI"
        required: false
        default: "300"
  push:
    branches: [main]
    paths:
      - "Deutsch nach der Naturmethode kap. 1-36.pdf"
      - ".github/scripts/extract_reference_pages.py"
      - ".github/workflows/extract-reference-pages.yml"

permissions:
  contents: read

env:
  PDF: "Deutsch nach der Naturmethode kap. 1-36.pdf"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow

      - name: Extract representative pages
        env:
          PAGES: ${{ github.event.inputs.pages || '70,83' }}
          DPI: ${{ github.event.inputs.dpi || '300' }}
        run: |
          python .github/scripts/extract_reference_pages.py "$PDF" \
            --pages "$PAGES" \
            --dpi "$DPI" \
            --output analysis/reference
          cat analysis/reference/README.md
          cat analysis/reference/geometry.json

      - name: Upload page cuts and geometry
        uses: actions/upload-artifact@v4
        with:
          name: representative-pages
          path: analysis/reference/
          if-no-files-found: error
          retention-days: 30
