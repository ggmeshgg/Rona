name: Extract and reconstruct representative pages

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "1-based PDF page numbers to extract, comma-separated"
        required: false
        default: "70,83"
      dpi:
        description: "Reference render DPI"
        required: false
        default: "300"
  push:
    branches: [main]
    paths:
      - "Deutsch nach der Naturmethode kap. 1-36.pdf"
      - ".github/scripts/extract_reference_pages.py"
      - ".github/scripts/reconstruct_pages.py"
      - ".github/workflows/extract-reference-pages.yml"
      - "reconstruction/**"

permissions:
  contents: read

env:
  PDF: "Deutsch nach der Naturmethode kap. 1-36.pdf"

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-urw-base35 fontconfig
          fc-match C059

      - name: Install reconstruction dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow CairoSVG

      - name: Extract representative source pages
        env:
          PAGES: ${{ github.event.inputs.pages || '70,83' }}
          DPI: ${{ github.event.inputs.dpi || '300' }}
        run: |
          python .github/scripts/extract_reference_pages.py "$PDF" \
            --pages "$PAGES" \
            --dpi "$DPI" \
            --output analysis/reference
          cat analysis/reference/README.md
          cat analysis/reference/geometry.json

      - name: Reconstruct pages 70 and 83
        run: |
          python .github/scripts/reconstruct_pages.py "$PDF" --output reconstruction/output
          cat reconstruction/output/README.md
          cat reconstruction/output/manifest.json

      - name: Upload reference extraction
        uses: actions/upload-artifact@v7
        with:
          name: representative-pages
          path: analysis/reference/
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconstructed pages
        uses: actions/upload-artifact@v7
        with:
          name: reconstructed-pages
          path: reconstruction/output/
          if-no-files-found: error
          retention-days: 30
